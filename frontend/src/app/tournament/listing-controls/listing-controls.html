@let l = listing();
<div class="toolbar card border-0 shadow-sm px-3 py-2 mb-3">
  @if (heading(); as text) {
    <h2 class="h6 fw-semibold mb-0 me-auto">{{ text }}</h2>
  }
  <div class="input-group input-group-sm">
    <label class="input-group-text" for="sort-field">Sort by</label>
    <select
      id="sort-field"
      class="form-select"
      data-testid="sort-field"
      #field
      [value]="l.sortField()"
      (change)="l.changeSortField(field.value)"
    >
      <option value="wins">Wins</option>
      <option value="losses">Losses</option>
      <option value="ties">Ties</option>
      <option value="name">Name</option>
      <option value="id">ID</option>
    </select>
    <label class="visually-hidden" for="sort-direction">Direction</label>
    <select
      id="sort-direction"
      class="form-select"
      data-testid="sort-direction"
      #direction
      [value]="l.sortDirection()"
      (change)="l.changeSortDirection(direction.value)"
    >
      <option value="asc">↑ Ascending</option>
      <option value="desc">↓ Descending</option>
    </select>
  </div>
  <div class="input-group input-group-sm">
    <label class="input-group-text" for="page-size">Per page</label>
    <select
      id="page-size"
      class="form-select"
      data-testid="page-size"
      #size
      [value]="l.pageSize()"
      (change)="l.changePageSize(size.value)"
    >
      <option value="4">4</option>
      <option value="8">8</option>
      <option value="16">16</option>
    </select>
  </div>
  <ng-content />
</div>
